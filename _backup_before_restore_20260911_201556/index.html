<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BLOOM : CYCLE</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>

<body>

<div id="loading">

    <div class="loading-logo">

        BLOOM : CYCLE

    </div>

    <div class="loading-line">

        <div class="loading-bar"></div>

    </div>

</div>

<div id="fade"></div>

<header class="site-header">

    <a href="/" class="logo">

        BLOOM : CYCLE

    </a>

</header>

<section class="hero">

    <video
    class="hero-video"
    muted
    playsinline
    preload="auto">

        <source
        src="/assets/eggBloom.mp4"
        type="video/mp4">

    </video>

    <img
    class="hero-egg"
    src="/assets/egg.png"
    alt="egg">

    <div class="hero-content">

        <h1 class="hero-title">

            BLOOM : CYCLE

        </h1>

        <p class="hero-sub">

            Life endlessly blooms,
            transforms,
            fades,
            and begins again.

        </p>

    </div>

</section>
<div class="flower-info" id="flower1-info">

    <span class="flower-number">01</span>

    <h2>LAMP</h2>

    <p>
        은방울꽃을 모티브로 제작한<br>
        인테리어 무드등
    </p>

</div>

<div class="flower-info right" id="flower2-info">

    <span class="flower-number">02</span>

    <h2>TRAY</h2>

    <p>
        영상 속 꽃의 형태를 활용한<br>
        오브제 액세서리 트레이
    </p>

</div>

<div class="flower-info" id="flower3-info">

    <span class="flower-number">03</span>

    <h2>FILM</h2>

    <p>
        프로젝트 스틸컷
    </p>

</div>

<div class="scroll-ui">

    <span>SCROLL</span>

    <div class="scroll-line">

        <div class="scroll-dot"></div>

    </div>

</div>

<script type="module" src="/src/main.js"></script>

</body>

</html>
